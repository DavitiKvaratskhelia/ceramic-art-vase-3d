<style>
  /* ── Theme tokens. Dark is the default; [data-theme="light"] overrides. ── */
  :root {
    --theme-dur: 240ms;      /* UI colour changes */
    --bg-dur: 850ms;         /* backdrop cross-fade between modes */
    --zoommer: #ff5000;      /* official Zoommer orange (brand logo SVG) */
    --fg: #ecedf0;
    --muted: rgba(236, 237, 240, 0.55);
    --panel: rgba(30, 32, 37, 0.58);
    --line: rgba(255, 255, 255, 0.09);
    --accent: #8fb0ff;
    /* Shared glass material (control bar + theme switch) */
    --glass-bg: rgba(26, 28, 33, 0.52);
    --glass-border: rgba(255, 255, 255, 0.13);
    --glass-filter: blur(20px) saturate(150%);
    --glass-shadow: 0 12px 36px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.07);
    --ctl-icon: rgba(236, 237, 240, 0.62);
    --ctl-icon-hover: #f4f5f7;
    --ctl-hover-bg: rgba(255, 255, 255, 0.08);
    --ctl-active-bg: #eceef2;
    --ctl-active-icon: #15171c;
    --ctl-active-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    --sep: rgba(255, 255, 255, 0.16);
    /* Zoom slider */
    --track: rgba(255, 255, 255, 0.12);
    --tick: rgba(255, 255, 255, 0.2);
    --tick-zero: rgba(255, 255, 255, 0.55);
    --num: rgba(255, 255, 255, 0.035);
    --num-active: rgba(255, 255, 255, 0.06);
    --swatch-border: rgba(255, 255, 255, 0.25);
    --ring-gap: #121316;
    --ring: rgba(255, 255, 255, 0.85);
    --spinner: rgba(255, 255, 255, 0.85);
    --spinner-track: rgba(255, 255, 255, 0.14);
    --page-bg:
      radial-gradient(60% 45% at 50% 42%, rgba(120, 130, 155, 0.16) 0%, rgba(0, 0, 0, 0) 70%),
      radial-gradient(130% 95% at 50% 40%, #2a2c31 0%, #18191c 50%, #0b0c0e 100%);
    --page-bg-light:
      radial-gradient(60% 45% at 50% 42%, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0) 70%),
      radial-gradient(130% 95% at 50% 40%, #f5f6f8 0%, #e5e7eb 55%, #d3d6dc 100%);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --fg: #1b1d22;
    --muted: rgba(27, 29, 34, 0.55);
    --panel: rgba(255, 255, 255, 0.5);
    --line: rgba(20, 22, 28, 0.08);
    --accent: #3d6bff;
    --glass-bg: rgba(255, 255, 255, 0.5);
    --glass-border: rgba(255, 255, 255, 0.8);
    --glass-shadow: 0 12px 36px rgba(28, 34, 48, 0.16), 0 0 0 0.5px rgba(20, 22, 28, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.7);
    --ctl-icon: rgba(28, 30, 36, 0.58);
    --ctl-icon-hover: #14161b;
    --ctl-hover-bg: rgba(20, 22, 28, 0.06);
    --ctl-active-bg: #ffffff;
    --ctl-active-icon: #15171c;
    --ctl-active-shadow: 0 2px 10px rgba(28, 34, 48, 0.18);
    --sep: rgba(20, 22, 28, 0.12);
    --track: rgba(20, 22, 28, 0.1);
    --tick: rgba(20, 22, 28, 0.22);
    --tick-zero: rgba(20, 22, 28, 0.6);
    --num: rgba(20, 22, 28, 0.045);
    --num-active: rgba(20, 22, 28, 0.07);
    --swatch-border: rgba(20, 22, 28, 0.18);
    --ring-gap: #eceef1;
    --ring: rgba(20, 22, 28, 0.7);
    --spinner: rgba(20, 22, 28, 0.75);
    --spinner-track: rgba(20, 22, 28, 0.12);
    color-scheme: light;
  }
  :root[data-theme="zoommer"] {
    --fg: #ffffff;
    --muted: rgba(255, 255, 255, 0.8);
    --panel: rgba(112, 34, 0, 0.24);
    --line: rgba(255, 255, 255, 0.2);
    --accent: #ffffff;
    --glass-bg: rgba(96, 28, 0, 0.34);
    --glass-border: rgba(255, 255, 255, 0.3);
    --glass-shadow: 0 14px 40px rgba(96, 26, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    --ctl-icon: rgba(255, 255, 255, 0.9);
    --ctl-icon-hover: #ffffff;
    --ctl-hover-bg: rgba(255, 255, 255, 0.14);
    --ctl-active-bg: #ffffff;
    --ctl-active-icon: #1c1d21;
    --ctl-active-shadow: 0 3px 12px rgba(110, 30, 0, 0.3);
    --sep: rgba(255, 255, 255, 0.32);
    --track: rgba(255, 255, 255, 0.26);
    --tick: rgba(255, 255, 255, 0.45);
    --tick-zero: #ffffff;
    --num: rgba(255, 255, 255, 0.07);
    --num-active: rgba(255, 255, 255, 0.11);
    --swatch-border: rgba(255, 255, 255, 0.55);
    --ring-gap: #ff5a12;
    --ring: #ffffff;
    --spinner: #ffffff;
    --spinner-track: rgba(255, 255, 255, 0.3);
    color-scheme: dark;
  }
  /* On orange the slider's orange fill would vanish — switch it to white. */
  :root[data-theme="zoommer"] .zoom { --accent-a: #ffffff; --accent-b: #ffe6d6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    color: var(--fg);
    background: var(--page-bg);
    background-color: #121316;
    font-family: "Noto Sans Georgian", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    transition: color var(--theme-dur) ease;
  }
  /* Mode backdrops cross-fade over the dark base (gradients themselves can't be transitioned). */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background: var(--page-bg-light);
    opacity: 0;
    transition: opacity var(--bg-dur) ease;
    pointer-events: none;
  }
  :root[data-theme="light"] body::before { opacity: 1; }

  /* Zoommer studio: orange cyclorama — deep edges, soft centre light, broad overhead beam,
     lit floor and a light haze. Pure gradients (no filters) so it stays cheap on phones. */
  .zenv {
    position: fixed; inset: -3%; z-index: -1;
    opacity: 0;
    transition: opacity var(--bg-dur) ease;
    pointer-events: none;
    overflow: hidden;
  }
  :root[data-theme="zoommer"] .zenv { opacity: 1; }

  /* Zoommer brand typography: a flat white HTML/SVG layer *behind* the transparent WebGL canvas.
     The phone therefore always covers it, can never intersect it in 3D, and it never moves with the model.
     Sizes / positions are set in px by layoutBrand() on resize only. */
  .ztype {
    position: fixed; inset: 0; z-index: -1;
    opacity: 0;
    transition: opacity var(--bg-dur) ease;
    pointer-events: none;
    color: #ffffff;
    contain: strict;
  }
  :root[data-theme="zoommer"] .ztype { opacity: 1; }
  .ztype > * { position: absolute; left: 50%; top: 0; transform: translate(-50%, -50%); }
  .zt-line {
    display: flex; align-items: center;
    white-space: nowrap;
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    letter-spacing: -0.012em;
    line-height: 1;
    font-size: 100px;
  }
  .zt-pro, .zt-word { display: block; fill: #ffffff; overflow: visible; }
  /* When the big words pass behind the zoom slider (narrow screens), back it with the bar's glass. */
  .zoom::before {
    content: ""; position: absolute; inset: 6px -6px; z-index: -1;
    border-radius: 999px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--glass-filter);
    -webkit-backdrop-filter: var(--glass-filter);
    box-shadow: var(--glass-shadow);
    opacity: 0;
    transition: opacity var(--bg-dur) ease;
    pointer-events: none;
  }
  :root[data-theme="zoommer"].zt-under-slider .zoom::before { opacity: 1; }
  .zenv > i { position: absolute; display: block; }
  .zenv .z-base {
    inset: 0;
    background: radial-gradient(120% 95% at 50% 40%, #ff8538 0%, #ff5000 36%, #d84300 66%, #8c2900 100%);
  }
  .zenv .z-glow {
    inset: 0;
    background: radial-gradient(44% 40% at 50% 40%, rgba(255, 200, 156, 0.55) 0%, rgba(255, 164, 104, 0.18) 45%, rgba(255, 120, 60, 0) 75%);
    transform: translate3d(calc(var(--px, 0) * 8px), calc(var(--py, 0) * 6px), 0);
  }
  .zenv .z-beam {
    left: 50%; top: -14%;
    width: 72vmax; height: 96vh; margin-left: -36vmax;
    background: radial-gradient(50% 100% at 50% 0%, rgba(255, 242, 230, 0.34) 0%, rgba(255, 226, 202, 0.12) 42%, rgba(255, 210, 180, 0) 72%);
    transform: translate3d(calc(var(--px, 0) * 20px), calc(var(--py, 0) * 10px), 0);
  }
  .zenv .z-floor {
    left: -8%; right: -8%; bottom: 0; height: 48%;
    background:
      radial-gradient(60% 40% at 50% 44%, rgba(255, 216, 184, 0.46) 0%, rgba(255, 172, 122, 0.16) 46%, rgba(255, 120, 60, 0) 76%),
      linear-gradient(180deg, rgba(255, 120, 50, 0) 0%, rgba(118, 32, 0, 0.3) 100%);
    transform: translate3d(calc(var(--px, 0) * -14px), calc(var(--py, 0) * -5px), 0);
  }
  .zenv .z-fog {
    inset: 0;
    background: radial-gradient(85% 55% at 50% 64%, rgba(255, 234, 216, 0.16) 0%, rgba(255, 234, 216, 0) 70%);
    transform: translate3d(calc(var(--px, 0) * 5px), 0, 0);
  }
  /* Same glass material for every floating control surface. */
  .glass {
    height: 56px;
    padding: 8px;
    border-radius: 999px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--glass-filter);
    -webkit-backdrop-filter: var(--glass-filter);
    box-shadow: var(--glass-shadow);
    transition: background-color var(--theme-dur) ease, border-color var(--theme-dur) ease, box-shadow var(--theme-dur) ease;
  }
  #c {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
    outline: none;
  }
  #c.dragging { cursor: grabbing; }

  header {
    position: fixed;
    top: max(18px, env(safe-area-inset-top));
    left: max(22px, env(safe-area-inset-left));
    pointer-events: none;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
  header p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }

  .swatches {
    position: fixed;
    top: max(18px, env(safe-area-inset-top));
    right: max(22px, env(safe-area-inset-right));
    display: flex; gap: 10px; padding: 7px 9px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
  }
  .swatches button {
    width: 20px; height: 20px; padding: 0;
    border-radius: 50%;
    border: 1px solid var(--swatch-border);
    background: var(--sw);
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .swatches button:hover { transform: scale(1.1); }
  .swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ring-gap), 0 0 0 3.5px var(--ring); }

  /* ── Control bar: glass capsule, one row of 40 × 40 icon buttons ── */
  .dock {
    position: fixed;
    z-index: 5;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px;
    width: max-content;
    max-width: calc(100vw - 24px);
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    touch-action: pan-x;
  }
  .dock::-webkit-scrollbar { display: none; }
  .dock .group { position: relative; display: flex; align-items: center; gap: 6px; flex: none; }
  .dock button {
    position: relative; z-index: 1;
    flex: none;
    display: grid; place-items: center;
    width: 40px; height: 40px; padding: 0;
    appearance: none;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--ctl-icon);
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color 0.18s ease, color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
  }
  .dock button svg {
    width: 21px; height: 21px;
    fill: none; stroke: currentColor; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round;
    pointer-events: none;
  }
  .dock button:hover { color: var(--ctl-icon-hover); background: var(--ctl-hover-bg); }
  .dock button:active { transform: scale(0.94); }
  /* Selected state: light pill, dark icon */
  .dock button.active,
  .dock button[aria-pressed="true"] { color: var(--ctl-active-icon); background: transparent; }
  .dock button.active:hover { color: var(--ctl-active-icon); background: transparent; }
  .dock #auto[aria-pressed="true"],
  .dock #auto[aria-pressed="true"]:hover { color: var(--ctl-active-icon); background: var(--ctl-active-bg); box-shadow: var(--ctl-active-shadow); }
  /* Segmented control: one light indicator slides between the mutually exclusive views */
  .dock .seg-ind {
    position: absolute; left: 0; top: 0; z-index: 0;
    width: 40px; height: 40px;
    border-radius: 999px;
    background: var(--ctl-active-bg);
    box-shadow: var(--ctl-active-shadow);
    opacity: 0;
    transition: transform 0.2s cubic-bezier(0.3, 0.7, 0.2, 1), opacity 0.18s ease, background-color var(--theme-dur) ease;
    pointer-events: none;
  }
  .dock .seg-ind.show { opacity: 1; }
  .dock .sep { flex: none; width: 1px; height: 24px; margin: 0 2px; background: var(--sep); }

  /* ── Theme switch: Light / Dark / Zoommer. Same glass capsule as the bar (shared .glass);
        three equal 40 px slots and one 40 px knob sliding between them. 136 = 2 × (1 border + 7) + 3 × 40 ── */
  .theme-toggle {
    position: fixed; z-index: 5; left: 0; top: 0;
    display: flex; align-items: center;
    width: 136px;
    padding: 7px;                  /* + 1 px border = 8 px from the outer edge, like the bar */
    visibility: hidden;            /* shown once JS has measured where it goes */
  }
  .theme-toggle.placed { visibility: visible; }
  .theme-toggle .tt-knob {
    position: absolute; left: 7px; top: 7px;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--ctl-active-bg);
    box-shadow: var(--ctl-active-shadow);
    transform: translateX(calc(var(--i, 1) * 40px));
    transition: transform 260ms cubic-bezier(0.3, 0.7, 0.2, 1), background-color var(--theme-dur) ease, box-shadow var(--theme-dur) ease;
    pointer-events: none;
  }
  .theme-toggle button,
  .share button {
    position: relative; z-index: 1;
    flex: none;
    display: grid; place-items: center;
    width: 40px; height: 40px; padding: 0; margin: 0;
    appearance: none; border: 0; border-radius: 50%;
    background: transparent;
    color: var(--ctl-icon);
    cursor: pointer;
    touch-action: manipulation;
    transition: color 0.2s ease, background-color 0.18s ease, transform 0.18s ease;
  }
  .theme-toggle button:hover,
  .share button:hover { color: var(--ctl-icon-hover); background: var(--ctl-hover-bg); }
  .theme-toggle button[aria-checked="true"],
  .theme-toggle button[aria-checked="true"]:hover { color: var(--ctl-active-icon); background: transparent; }
  .theme-toggle button:active,
  .share-main button:active { transform: scale(0.92); }
  .theme-toggle button:focus-visible,
  .share button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .theme-toggle svg,
  .share svg {
    width: 20px; height: 20px;
    fill: none; stroke: currentColor; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round;
    pointer-events: none;
  }
  /* The filled, circular emblem reads heavier than line icons — 19 px matches their visual weight. */
  .theme-toggle svg.zm { width: 19px; height: 19px; fill: currentColor; stroke: none; }
  @media (prefers-reduced-motion: reduce) {
    .theme-toggle .tt-knob { transition-duration: 0.01ms; }
    .zenv, .ztype, body::before { transition-duration: 200ms; }
  }

  /* ── Share: 56 × 56 glass button, left edge, vertically centred; menu capsule slides out to its right ── */
  .share {
    position: fixed; z-index: 6;
    left: calc(24px + env(safe-area-inset-left));
    top: 50%;
    width: 56px; height: 56px;
    /* Whole control (button, menu, gaps) drawn at 90 %: 56 → 50.4 px, 40 → 36 px.
       Scaling from the left-centre keeps its left edge and vertical centre in place. */
    transform: translateY(-50%) scale(0.9);
    transform-origin: 0 50%;
  }
  .share-main {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    width: 56px;
    padding: 7px;                                   /* + 1 px border = 8 px */
  }
  .share-main svg { position: absolute; transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.3, 0.7, 0.2, 1); }
  .share-main .i-close { opacity: 0; transform: rotate(-90deg) scale(0.6); }
  .share.open .share-main .i-share { opacity: 0; transform: rotate(90deg) scale(0.6); }
  .share.open .share-main .i-close { opacity: 1; transform: none; }
  /* The main button sits alone in its glass circle: no inner hover disc, just a brighter icon. */
  .share .share-main button:hover,
  .share.open .share-main button { color: var(--ctl-icon-hover); background: transparent; }

  .share-menu {
    position: absolute; z-index: 1; left: 64px; top: 0;       /* 56 px button + 8 px gap */
    display: flex; align-items: center; gap: 6px;
    width: max-content;
    padding: 7px;
    transform-origin: left center;
    opacity: 0;
    transform: translateX(-12px) scale(0.92);
    visibility: hidden;
    /* closing: quicker, no overshoot */
    transition: opacity 200ms ease, transform 230ms cubic-bezier(0.4, 0, 0.7, 0.2), visibility 0s linear 230ms,
      background-color var(--theme-dur) ease, border-color var(--theme-dur) ease, box-shadow var(--theme-dur) ease;
  }
  .share.open .share-menu {
    opacity: 1; transform: none; visibility: visible;
    /* opening: ~330 ms with a light spring */
    transition: opacity 220ms ease, transform 330ms cubic-bezier(0.34, 1.32, 0.64, 1), visibility 0s,
      background-color var(--theme-dur) ease, border-color var(--theme-dur) ease, box-shadow var(--theme-dur) ease;
  }
  .share-menu button { opacity: 0; transform: translateX(-6px) scale(0.9); }
  .share.open .share-menu button {
    opacity: 1; transform: none;
    transition: opacity 220ms ease calc(60ms + var(--k, 0) * 40ms),
      transform 300ms cubic-bezier(0.34, 1.32, 0.64, 1) calc(60ms + var(--k, 0) * 40ms),
      color 0.2s ease, background-color 0.18s ease;
  }
  .share.open .share-menu button:active { transform: scale(0.92); transition-delay: 0s; }
  .share-menu button[hidden] { display: none; }
  .share-menu button svg { position: absolute; transition: opacity 0.18s ease, transform 0.22s ease; }
  .share-menu button .i-check { opacity: 0; transform: scale(0.6); }
  .share-menu button.done .i-main { opacity: 0; transform: scale(0.6); }
  .share-menu button.done .i-check { opacity: 1; transform: none; }
  .share svg .dot { fill: currentColor; stroke: none; }

  /* Not enough width (very narrow phones): stack the actions vertically next to the button. */
  .share.vertical .share-menu { left: 0; top: 64px; flex-direction: column; transform-origin: top center; transform: translateY(-12px) scale(0.92); }
  .share.vertical.up .share-menu { top: auto; bottom: 64px; transform-origin: bottom center; transform: translateY(12px) scale(0.92); }
  .share.vertical.open .share-menu { transform: none; }
  .share.vertical .share-menu button { transform: translateY(-6px) scale(0.9); }
  .share.vertical.open .share-menu button { transform: none; }

  .share-toast {
    position: absolute; left: 64px; top: 66px;
    height: auto; padding: 8px 14px;
    font-size: 12.5px; line-height: 1.2; white-space: nowrap;
    color: var(--fg);
    opacity: 0; transform: translateY(-4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
  }
  .share-toast.show { opacity: 1; transform: none; }
  .share.vertical .share-toast { top: 4px; }

  @media (max-width: 640px) {
    .share { left: calc(14px + env(safe-area-inset-left)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .share-menu, .share.open .share-menu, .share-menu button, .share.open .share-menu button,
    .share.vertical .share-menu, .share.vertical .share-menu button {
      transform: none !important;
      transition: opacity 120ms ease, visibility 0s linear 120ms !important;
    }

  window.__showError = function (title, msg) {

    document.getElementById('error-title').textContent = title;
    document.getElementById('error-msg').textContent = msg;
    document.getElementById('error').hidden = false;
  };
  (function () {
    var ok = false;
    try {
      var c = document.createElement('canvas');
      var gl = window.WebGL2RenderingContext && c.getContext('webgl2');
      ok = !!gl;
      if (gl) { var ext = gl.getExtension('WEBGL_lose_context'); if (ext) ext.loseContext(); }
    } catch (e) { ok = false; }
    window.__WEBGL_OK__ = ok;
    if (!ok) {
      window.__showError(
        'WebGL ხელმისაწვდომი არ არის',
        'თქვენი ბრაუზერი ან მოწყობილობა 3D გრაფიკას (WebGL 2) არ უჭერს მხარს, ან ის გამორთულია. გამოიყენეთ Chrome, Edge, Firefox ან Safari-ს განახლებული ვერსია და ჩართეთ აპარატურული აჩქარება (hardware acceleration).'

    window.__loadTimer = setTimeout(function () {
      if (!window.__LIB_LOADED__ && window.__WEBGL_OK__) {
        window.__showError('ჩატვირთვა ვერ დასრულდა', 'Three.js ბიბლიოთეკა CDN-დან იტვირთება. შეამოწმეთ ინტერნეტ-კავშირი და განაახლეთ გვერდი.');
      }
    }, 25000);
  })();

<script type="module">
const loaderEl = document.getElementById('loader');
const loaderText = document.getElementById('loader-text');
// Let the loader repaint between build steps (setTimeout fallback keeps going in background tabs).
const step = (t) => { loaderText.textContent = t; return new Promise(r => { requestAnimationFrame(() => r()); setTimeout(r, 60); }); };

if (window.__WEBGL_OK__) {
  main().catch((err) => {
    console.error(err);
    window.__showError('დაფიქსირდა შეცდომა', 'სცენის აგება ვერ მოხერხდა: ' + (err && err.message ? err.message : err));
  });
}

async function main() {
  await step('ბიბლიოთეკის ჩატვირთვა…');
  let THREE;
  try {
    THREE = await import('three');
  } catch (e) {
    console.error(e);
    window.__showError('Three.js ვერ ჩაიტვირთა', 'ბიბლიოთეკა CDN-დან (cdn.jsdelivr.net) იტვირთება — შეამოწმეთ ინტერნეტ-კავშირი და განაახლეთ გვერდი.');
    return;
  }
  window.__LIB_LOADED__ = true;

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ───────────────────────── Renderer / scene / camera ─────────────────────────
  const canvas = document.getElementById('c');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (e) {
    window.__showError('WebGL ხელმისაწვდომი არ არის', 'WebGL კონტექსტის შექმნა ვერ მოხერხდა. ჩართეთ აპარატურული აჩქარება ან სცადეთ სხვა ბრაუზერი.');
    return;
  }
  canvas.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    window.__showError('WebGL კონტექსტი დაიკარგა', 'გრაფიკული დრაივერი გადაიტვირთა. განაახლეთ გვერდი.');
  });

  const maxPR = Math.min(window.devicePixelRatio || 1, 2);
  let pixelRatio = maxPR;
  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1.1;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(28, window.innerWidth / window.innerHeight, 10, 5000);
  const LOOK_AT = new THREE.Vector3(0, 0, 0);

  // ───────────────────────── Dimensions (millimetres) ─────────────────────────
  // No published spec: proportions are measured on the straight-on side photos (height ≈ 1.42 × the widest
  // diameter, neck ≈ 0.61 ×, foot ≈ 0.44 ×); the absolute scale comes from the 12.7 mm bumper pads under the foot.
  // Everything is therefore an estimate — see README.
  const VASE_H = 341;                                       // foot bottom → top of the lip
  const PAD = 2;                                            // clear bumper pads under the foot ring
  const H = VASE_H + PAD;                                   // overall height
  const Y0 = -H / 2;                                        // model centred on its height
  const BY = Y0 + PAD;                                      // foot bottom (model y)
  const R_MAX = 121;                                        // widest radius, ≈ 65 % of the height up
  const EXT = { x: R_MAX, zMin: -R_MAX, zMax: R_MAX };      // footprint for the floor shadow
  const FOOT_R = 53, RECESS = 3.5;                          // foot ring outer radius; depth of the recessed base
  const PAD_R = 6.35, PAD_AT = 47.5;                        // bumper pad radius and its distance from the axis

  // ───────────────────────── Vase form ─────────────────────────
  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;

  // Outer profile [radius, height above the foot bottom]: foot bevel → ovoid body (widest ≈ 222 mm up) →
  // rounded shoulder → short, very slightly flared neck. Measured from the side photos (right silhouette edge).
  const P_OUT = [[53, 0], [54.6, 0.8], [55.7, 2.6], [57.6, 6], [61, 12], [66, 20.5], [72, 31], [80, 47], [88.5, 66],
    [99, 95], [108, 135], [114, 168], [118.6, 195], [120.6, 222], [119.6, 241], [116, 258], [109.5, 273], [100, 285],
    [89, 294.5], [80.5, 301], [75.6, 305.6], [73.4, 310.5], [73.1, 318], [73.6, 331], [74, 338.4]];
  // Thick, flat lip (10 mm) with rounded edges, then the inside: ≈ 9 mm wall, glazed floor.
  const LIP = { ro: 74, ri: 64, top: VASE_H, rr: 2.6 };
  const P_IN = [[64, 338.4], [63.6, 331], [63.3, 318], [63.5, 311.5], [65.5, 306], [71, 300.5], [81, 293.5], [92.5, 285],
    [101, 274], [107, 260], [110.6, 243], [111.8, 222], [110, 195], [105.5, 168], [99.5, 135], [90.5, 97], [80, 68],
    [71.5, 49], [63.5, 33], [56, 22.5], [48, 16], [36, 13], [18, 12.2], [0, 12]];

  const curve2 = (pts) => new THREE.CatmullRomCurve3(pts.map(([r, h]) => new THREE.Vector3(r, h, 0)), false, 'centripetal');
  const outerCurve = curve2(P_OUT), innerCurve = curve2(P_IN);
  // radius of the outer surface at height h (the outer profile rises monotonically up to the lip)
  const outerSamples = outerCurve.getSpacedPoints(400);
  function outerR(h) {
    for (let i = 1; i < outerSamples.length; i++) {
      const a = outerSamples[i - 1], b = outerSamples[i];
      if (b.y >= h) return lerp(a.x, b.x, (h - a.y) / (b.y - a.y || 1));
    }
    return outerSamples[outerSamples.length - 1].x;
  }

  // ───────────────────────── Ink-brush glaze (procedural) ─────────────────────────
  // The outside is one cylindrical texture: u = angle θ round the axis, v = arc length s up the profile from the
  // foot edge to the inner edge of the lip. Strokes are laid out in surface millimetres and mapped through the
  // real radius at that s, so a 100 mm stroke is 100 mm long on the neck as well as on the belly. The texture
  // wraps at θ = 0, so every mark is drawn again one texture width left / right when it crosses that seam.
  function makeRng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const C = {   // glossy glazes, sampled from the photos (neutral light, before the studio lighting)
    glaze: '#e0e1de', glaze2: '#d3d5d3', glaze3: '#ebebe8', line: '#76797c', line2: '#55585c',
    ink: '#131417', ink2: '#1d1f23', gray: '#64676b', gray2: '#86898d', gray3: '#a9acaf', umber: '#4a4440',
    bisque: '#ebe7df', bisque2: '#f2efe9'
  };
  function shade(hex, k) {             // k ∈ [-1, 1]: darker … lighter
    const n = parseInt(hex.slice(1), 16);
    let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const tgt = k > 0 ? 255 : 0, a = Math.abs(k);
    r += (tgt - r) * a; g += (tgt - g) * a; b += (tgt - b) * a;
    return `rgb(${r | 0},${g | 0},${b | 0})`;
  }
  const TAU = Math.PI * 2;
  const pick = (rng, list) => list[Math.floor(rng() * list.length)];

  // Height canvas → normal map (1-2-1 blur each way, x wraps round the seam when `wrap`).
  function normalFromHeight(hx, w, h, gain, wrap) {
    const hd = hx.getImageData(0, 0, w, h).data;
    const hs = new Float32Array(w * h), ht = new Float32Array(w * h);
    for (let i = 0; i < hs.length; i++) hs[i] = hd[i * 4];
    const xm = (x) => (wrap ? (x + w) % w : Math.min(Math.max(x, 0), w - 1));
    for (let y = 0; y < h; y++) for (let x = 0, r = y * w; x < w; x++) ht[r + x] = (hs[r + xm(x - 1)] + 2 * hs[r + x] + hs[r + xm(x + 1)]) * 0.25;
    for (let y = 0; y < h; y++) for (let x = 0, r = y * w; x < w; x++) hs[r + x] = (ht[Math.max(y - 1, 0) * w + x] + 2 * ht[r + x] + ht[Math.min(y + 1, h - 1) * w + x]) * 0.25;
    const nc = document.createElement('canvas');
    nc.width = w; nc.height = h;
    const ncx = nc.getContext('2d');
    const img = ncx.createImageData(w, h), d = img.data;
    for (let y = 0; y < h; y++) {
      const y0 = Math.max(y - 1, 0) * w, y1 = Math.min(y + 1, h - 1) * w, row = y * w;
      for (let x = 0; x < w; x++) {
        const nx = -(hs[row + xm(x + 1)] - hs[row + xm(x - 1)]) * 0.5 * gain / 255, ny = (hs[y1 + x] - hs[y0 + x]) * 0.5 * gain / 255;
        const l = Math.hypot(nx, ny, 1), j = (row + x) * 4;
        d[j] = (nx / l * 0.5 + 0.5) * 255; d[j + 1] = (ny / l * 0.5 + 0.5) * 255; d[j + 2] = (1 / l * 0.5 + 0.5) * 255; d[j + 3] = 255;
      }
    }
    ncx.putImageData(img, 0, 0);

  }
  function canvasTextures(col, nc) {
    const map = new THREE.CanvasTexture(col);
    map.colorSpace = THREE.SRGBColorSpace;
    const normalMap = new THREE.CanvasTexture(nc);
    for (const t of [map, normalMap]) { t.anisotropy = renderer.capabilities.getMaxAnisotropy(); t.userData.mimeType = 'image/jpeg'; }
    return { map, normalMap };
  }

  // plan(api) draws the marks; rho(s) = radius at arc length s; S = arc length at the top of the texture.
  function paintOuter(TW, TH, S, rho, seed, plan) {
    const rng = makeRng(seed);
    const col = document.createElement('canvas'), hgt = document.createElement('canvas');
    col.width = TW; col.height = TH;
    hgt.width = TW / 2; hgt.height = TH / 2;                  // relief at half resolution is plenty under gloss
    const cpu = { willReadFrequently: true };                // CPU raster: far faster than GPU canvas for thousands of lines
    const cx = col.getContext('2d', cpu), hx = hgt.getContext('2d', cpu);
    cx.fillStyle = C.glaze; cx.fillRect(0, 0, TW, TH);
    hx.fillStyle = '#000'; hx.fillRect(0, 0, TW, TH);
    hx.scale(0.5, 0.5);
    const kv = TH / S;                                        // px per mm along s
    const X = (th) => th / TAU * TW, Y = (s) => (1 - s / S) * TH;
    const toPx = (th0, s0, lx, ly) => { const s = s0 + ly; return [X(th0 + lx / Math.max(rho(s), 8)), Y(s)]; };
    // draw `fn(g)` on a context once per seam copy that the marks' x-range [x0, x1] reaches
    function wrapped(g, x0, x1, fn) {
      for (const off of [-TW, 0, TW]) {
        if (x1 + off < 0 || x0 + off > TW) continue;
        if (off) { g.save(); g.translate(off, 0); fn(); g.restore(); } else fn();
      }
    }
    function polyline(g, pts) {
      let a = Infinity, b = -Infinity;
      for (const p of pts) { if (p[0] < a) a = p[0]; if (p[0] > b) b = p[0]; }
      wrapped(g, a, b, () => {
        g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
        g.stroke();
      });
    }

    // A horizontal brush sweep made of fine bristle rows. Both ends taper to a point (the tip sits anywhere between
    // the stroke's top and bottom edge) and split into a few flame-like fingers; near the tips the bristles break up
    // (dry brush). The top / bottom edges wave gently. Rows overlap slightly so the body reads as one glossy sweep.
    function stroke(th0, s0, len, hgt, color, o = {}) {
      th0 = ((th0 % TAU) + TAU) % TAU;
      const alpha = o.alpha ?? 0.94, dry = o.dry ?? 0.5, relief = o.relief ?? 1, streak = o.streak ?? 0.08;
      const tilt = o.tilt ?? (rng() - 0.5) * 0.03, bend = o.bend ?? (rng() - 0.5) * 0.2;
      const tip = [o.tipL ?? 0.16 + rng() * 0.24, o.tipR ?? 0.18 + rng() * 0.3];      // taper length / len
      const ty = [o.yL ?? (rng() - 0.5) * 0.8, o.yR ?? (rng() - 0.5) * 0.8];           // tip height (−0.5 … 0.5)
      const fing = o.fingers ?? 0.32;
      const fq = [1.6 + rng() * 2.8, 1.6 + rng() * 2.8], fp = [rng() * TAU, rng() * TAU];
      const wob = (o.wob ?? 0.07) * hgt, wf = 0.6 + rng() * 1.4, wp = rng() * TAU;
      const sq = rng() * TAU;
      const n = Math.max(4, Math.round(hgt / 0.34));
      const lw = Math.max(0.9, (hgt / n) * kv * 1.4);
      cx.lineCap = 'butt'; hx.lineCap = 'butt';
      for (let i = 0; i < n; i++) {
        const yy = (i + 0.5) / n - 0.5;
        const end = (k) => {
          const d = Math.abs(yy - ty[k]) / (0.5 + Math.abs(ty[k]));
          const f = Math.pow(0.5 + 0.5 * Math.sin(TAU * fq[k] * yy + fp[k]), 2);
          return tip[k] * len * (Math.pow(d, 1.25) * (1 - fing * 0.5) + fing * f * (0.2 + 0.8 * d));
        };
        const xl = -len / 2 + end(0) + Math.pow(rng(), 3) * dry * len * 0.07;
        const xr = len / 2 - end(1) - Math.pow(rng(), 3) * dry * len * 0.07;
        if (xr - xl < 1.5) continue;
        const ly = yy * hgt;
        // split the row into short pieces; towards the tips some are skipped (dry brush)
        const seg = 2.5 + rng() * 3, pieces = [];
        let cur = null;
        for (let x = xl; x < xr; x += seg) {
          const x2 = Math.min(x + seg, xr);
          const endness = Math.abs((x + x2) / 2) / (len / 2);
          const skip = rng() < dry * 0.6 * smooth(0.55, 1.02, endness) + 0.008 * dry;
          if (skip) { cur = null; continue; }
          if (!cur) { cur = [x]; pieces.push(cur); }
          cur.push(x2);
        }
        const rowAlpha = alpha * (0.88 + 0.12 * rng());
        cx.strokeStyle = shade(color, (rng() - 0.5) * streak + 0.5 * streak * Math.sin(yy * 41 + sq));
        cx.lineWidth = lw * (0.9 + rng() * 0.25);
        hx.lineWidth = cx.lineWidth;
        const yAt = (x) => ly + tilt * x + bend * hgt * Math.pow(2 * x / len, 2) + wob * 2 * yy * Math.sin(TAU * wf * x / len + wp);
        for (const pc of pieces) {
          const pts = pc.map(x => toPx(th0, s0, x, yAt(x)));
          const mid = (pc[0] + pc[pc.length - 1]) / 2, endness = Math.abs(mid) / (len / 2);
          cx.globalAlpha = rowAlpha * (1 - 0.3 * dry * smooth(0.65, 1, endness));
          polyline(cx, pts);
          hx.globalAlpha = relief * (0.04 + 0.16 * smooth(0.6, 1, endness) + 0.1 * Math.pow(2 * Math.abs(yy), 6));
          hx.strokeStyle = '#fff';
          polyline(hx, pts);
        }
      }
      cx.globalAlpha = hx.globalAlpha = 1;
    }
    // Fine spun line (the light brushed-on glaze shows faint grey rings everywhere).
    function spin(th0, s0, len, w, color, alpha) {
      th0 = ((th0 % TAU) + TAU) % TAU;
      const pts = [], ph = rng() * TAU, wav = 0.15 + rng() * 0.35;
      cx.strokeStyle = color; cx.lineWidth = Math.max(0.8, w * kv); cx.lineCap = 'round';
      cx.globalAlpha = alpha;
      let gap = false;
      for (let x = -len / 2; x <= len / 2; x += 3) {
        const p = toPx(th0, s0, x, wav * Math.sin(x / 23 + ph));
        if (!gap) pts.push(p);
        if (rng() < 0.05) { if (pts.length > 1) polyline(cx, pts.splice(0)); else pts.length = 0; gap = true; }
        else gap = false;
      }
      if (pts.length > 1) polyline(cx, pts);
      cx.globalAlpha = 1;
    }
    function dot(th, s, r, color, alpha) {
      const [px, py] = [X(th), Y(s)];
      cx.globalAlpha = alpha; cx.fillStyle = color;
      wrapped(cx, px - 4, px + 4, () => { cx.beginPath(); cx.arc(px, py, Math.max(0.6, r * kv), 0, TAU); cx.fill(); });
      cx.globalAlpha = 1;
    }
    plan({ stroke, spin, dot, rng });
    return canvasTextures(col, normalFromHeight(hx, TW / 2, TH / 2, 2.4, true));
  }

  // The painted design, by height h on the body (sAt converts to texture arc length).
  // θ = π/2 faces the camera at yaw 0: the black column is centred there, leaning slightly right as it rises.
  const BAND = Math.PI / 2;
  const bandAt = (h) => BAND - 0.24 * (h - 150) / 120 + 0.05 * Math.sin(h / 37);
  const coreAt = (h) => 0.64 + 0.12 * (1 - smooth(25, 175, h));         // half-width of the black core (radians)
  function planOuter(sAt, sLipIn, S) {
    return ({ stroke, spin, dot, rng }) => {
      const hRand = (a, b) => a + rng() * (b - a);
      // 1. faint, broad unevenness of the white glaze
      for (let i = 0; i < 26; i++) {
        stroke(rng() * TAU, sAt(hRand(20, 330)), 160 + rng() * 260, 18 + rng() * 26, pick(rng, [C.glaze2, C.glaze3, C.glaze2]), { alpha: 0.35, dry: 0.9, streak: 0.04, relief: 0.2 });
      }
      // 2. spun grey hairlines: loose single lines plus groups of parallel bristle lines, densest on the shoulder and neck
      const top = sLipIn + 3;
      for (let i = 0; i < 2600; i++) {
        let s = rng() * top;
        if (s < sAt(220) && rng() < 0.35) s = sAt(220) + rng() * (top - sAt(220));
        spin(rng() * TAU, s, 20 + 240 * rng() * rng(), 0.1 + rng() * 0.16, rng() < 0.75 ? C.line : C.line2, 0.07 + rng() * 0.22);
      }
      for (let g = 0; g < 420; g++) {
        let s0 = rng() * top;
        if (s0 < sAt(220) && rng() < 0.4) s0 = sAt(220) + rng() * (top - sAt(220));
        const th0 = rng() * TAU, len = 60 + rng() * 260, k = 4 + Math.floor(rng() * 9), a = 0.08 + rng() * 0.15;
        for (let j = 0; j < k; j++) {

      for (let i = 0; i < 9; i++) {
        stroke(BAND + Math.PI + 0.25 + (rng() - 0.5) * 0.5, sAt(hRand(105, 235)), 70 + rng() * 90, 16 + rng() * 18, C.gray3, { alpha: 0.12, dry: 0.85, streak: 0.1, relief: 0.15 });
      }
      for (let i = 0; i < 18; i++) {
        stroke(rng() * TAU, sAt(hRand(15, 300)), 90 + rng() * 200, 10 + rng() * 22, pick(rng, [C.gray3, C.gray2]), { alpha: 0.08 + rng() * 0.08, dry: 0.85, relief: 0.15 });
      }

      //    black in the core, the edges zig-zagging from row to row
      const rows = [];
      for (let h = 12; h <= 262; h += 9 + rng() * 4.5) rows.push(h);
      const greys = (h, under) => {
        for (const side of [-1, 1]) {
          const nG = 1 + (rng() < 0.45);
          for (let k = 0; k < nG; k++) {
            if ((rng() < 0.45) !== under) continue;
            const r = outerR(h), edge = bandAt(h) + side * (coreAt(h) + (rng() - 0.45) * 0.3);
            const len = 80 + rng() * 150, inset = 25 + rng() * 40;
            const c = pick(rng, [C.gray, C.gray2, C.gray3, C.gray3]);
            stroke(edge + side * (len / 2 - inset) / r, sAt(h + (rng() - 0.5) * 9), len, 7 + rng() * 10, c,
              { alpha: 0.4 + rng() * 0.35, dry: 0.75, streak: 0.18, tipL: 0.25 + rng() * 0.25, tipR: 0.3 + rng() * 0.25 });
          }
        }
      };
      for (const h of rows) greys(h, true);
      for (const h of rows) {
        const r = outerR(h), c = bandAt(h), core = coreAt(h);
        const zl = core + (rng() - 0.5) * 0.5, zr = core + (rng() - 0.5) * 0.5;
        const passes = rng() < 0.45 ? 2 : 1;
        for (let p = 0; p < passes; p++) {
          const a = zl * (1 - 0.25 * p * rng()), b = zr * (1 - 0.25 * p * rng());
          stroke(c + (b - a) / 2, sAt(h + (rng() - 0.5) * 5), (a + b) * r * (h < 120 ? 1.02 : 1.14), 12 + rng() * 10, rng() < 0.75 ? C.ink : C.ink2,
            { alpha: 0.96, dry: 0.45, streak: 0.06 });
        }
        // small loose flames just past the left / right edge
        for (const side of [-1, 1]) if (rng() < 0.18) {
          const len = 40 + rng() * 50, at = c + side * ((side < 0 ? zl : zr) + (4 + rng() * 18 + len / 2) / r);
          stroke(at, sAt(h + (rng() - 0.5) * 8), len, 3 + rng() * 4, C.ink, { alpha: 0.9, dry: 0.6, streak: 0.06, tipL: 0.35, tipR: 0.45 });
        }
      }
      for (const h of rows) greys(h, false);
      // the band's top: a thin brown-grey sweep (thinned ink) above the first black stroke
      stroke(bandAt(268) + 0.08, sAt(270), (coreAt(268) * 2 + 0.25) * outerR(270), 8, C.umber, { alpha: 0.88, dry: 0.6, yL: 0.3, yR: 0.2 });
      stroke(bandAt(272) - 0.12, sAt(275), 0.95 * outerR(274), 4, C.gray, { alpha: 0.5, dry: 0.8 });
      // low on the belly the black wraps a little further round, with grey streaks beside it
      for (let h = 5; h < 34; h += 6 + rng() * 4) {
        const r = outerR(h);
        stroke(bandAt(h) + 0.12 + (rng() - 0.5) * 0.3, sAt(h), (coreAt(h) * 2 - 0.25 + rng() * 0.3) * r, 8 + rng() * 6, C.ink, { alpha: 0.92, dry: 0.5, streak: 0.06 });
        stroke(rng() * TAU, sAt(h), 60 + rng() * 120, 4 + rng() * 6, pick(rng, [C.gray2, C.gray3]), { alpha: 0.25, dry: 0.85 });
      }
      // 5. a few pinholes / specks in the glaze
      for (let i = 0; i < 260; i++) dot(rng() * TAU, rng() * top, 0.18 + rng() * 0.22, rng() < 0.7 ? '#4d4f52' : '#ffffff', 0.2 + rng() * 0.3);
      // 6. the unglazed foot edge: bisque below a ragged glaze line
      for (let th = 0; th < TAU; th += 0.012) {
        stroke(th, 0.6 + rng() * 0.8, 6 + rng() * 10, 1.2 + rng() * 1.6, C.bisque, { alpha: 1, dry: 0.4, relief: 0.6, tilt: 0, bend: 0, fingers: 0.2 });
      }
      void S;
    };
  }

  // Foot: unglazed bisque. Disc texture centred on the axis (radius in mm), recessed base with faint throwing rings,
  // rough foot ring with crumbs of glaze along its outer edge.
  function paintFoot(size, RF, seed) {
    const rng = makeRng(seed);
    const R = size / 2, k = R / RF;
    const col = document.createElement('canvas'), hgt = document.createElement('canvas');
    col.width = col.height = hgt.width = hgt.height = size;
    const cpu = { willReadFrequently: true };
    const cx = col.getContext('2d', cpu), hx = hgt.getContext('2d', cpu);
    cx.fillStyle = C.bisque; cx.fillRect(0, 0, size, size);
    hx.fillStyle = '#404040'; hx.fillRect(0, 0, size, size);
    const circle = (g, r, w, style, a) => { g.globalAlpha = a; g.strokeStyle = style; g.lineWidth = w; g.beginPath(); g.arc(R, R, r * k, 0, TAU); g.stroke(); };
    // recess: smoother, a touch lighter, faint concentric rings
    cx.fillStyle = C.bisque2; cx.beginPath(); cx.arc(R, R, 44.6 * k, 0, TAU); cx.fill();
    for (let i = 0; i < 70; i++) circle(cx, rng() * 44, 0.6 + rng() * 1.6, rng() < 0.6 ? '#b9b3a8' : '#ffffff', 0.04 + rng() * 0.06);
    // ring: rough, with chips and glaze crumbs near the edge
    for (let i = 0; i < 2600; i++) {
      const th = rng() * TAU, r = 44.8 + rng() * 8.6, px = R + r * k * Math.cos(th), py = R - r * k * Math.sin(th);
      const big = r > 50.5 && rng() < 0.25, rr = (big ? 0.4 + rng() * 0.9 : 0.12 + rng() * 0.3) * k;
      cx.globalAlpha = big ? 0.9 : 0.25 + rng() * 0.4;
      cx.fillStyle = big ? '#f6f5f2' : (rng() < 0.55 ? '#d2ccc1' : '#fbfaf7');
      cx.beginPath(); cx.ellipse(px, py, rr * (1 + rng()), rr, th, 0, TAU); cx.fill();
      hx.globalAlpha = big ? 0.8 : 0.35; hx.fillStyle = rng() < 0.5 || big ? '#ffffff' : '#000000';
      hx.beginPath(); hx.ellipse(px, py, rr * (1 + rng()), rr, th, 0, TAU); hx.fill();
    }
    circle(cx, 44.9, 1.5 * k / 10, '#a69f93', 0.35);
    cx.globalAlpha = hx.globalAlpha = 1;
    return canvasTextures(col, normalFromHeight(hx, size, size, 3, false));
  }

  function makeBlobTexture() {
    const s = 256, c = document.createElement('canvas');
    c.width = c.height = s;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(0.3, 'rgba(0,0,0,0.7)');
    g.addColorStop(0.65, 'rgba(0,0,0,0.22)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, s, s);
    return new THREE.CanvasTexture(c);
  }

  // ───────────────────────── Studio lighting environment ─────────────────────────
  await step('სტუდიური განათება…');
  function buildStudioEnvironment() {
    const env = new THREE.Scene();
    const sg = new THREE.SphereGeometry(50, 64, 32);
    const top = new THREE.Color(0x4a4e57), mid = new THREE.Color(0x24262b), bot = new THREE.Color(0x0b0b0c);
    const cols = [], pos = sg.attributes.position, tmp = new THREE.Color();
    for (let i = 0; i < pos.count; i++) {
      const t = pos.getY(i) / 50;
      tmp.copy(mid).lerp(t > 0 ? top : bot, Math.abs(t));
      cols.push(tmp.r, tmp.g, tmp.b);
    }
    sg.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
    env.add(new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));

    const panel = (w, h, k, p, tint = 0xffffff) => {
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ color: new THREE.Color(tint).multiplyScalar(k), side: THREE.DoubleSide })
      );
      m.position.set(...p);
      m.lookAt(0, 0, 0);
      env.add(m);
    };
    panel(6, 5, 3.2, [-5, 5, 5], 0xfff6ec);   // key softbox, upper-left front
    panel(9, 4, 1.4, [0, 8, 0]);              // overhead
    panel(2.4, 7, 1.7, [-8, 0.5, 1]);         // left strip → soft edge highlight on the glaze
    panel(2.4, 7, 1.4, [8, 0.5, -1.5], 0xeef3ff); // right strip
    for (const [x, z] of [[-2.5, 3], [1.5, 4.5], [3.5, 1], [-0.5, 5.5]]) panel(0.32, 0.32, 14, [x, 8, z]);   // ceiling spots → small glints
    panel(7, 2.2, 2.4, [0, 1.5, -8], 0xdfe8ff);    // rear rim
    panel(9, 2, 0.7, [0, -2.5, 8]);           // low front fill
    panel(8, 5, 0.95, [3, 8, 6.5]);        // large frontal softbox (lights faces turned to camera)
    panel(14, 14, 0.08, [0, -8, 0]);          // floor bounce

    const pmrem = new THREE.PMREMGenerator(renderer);
    const rt = pmrem.fromScene(env, 0.015);
    pmrem.dispose();
    env.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
    return rt.texture;
  }
  scene.environment = buildStudioEnvironment();
  scene.environmentIntensity = 1.25;

  const key = new THREE.DirectionalLight(0xfff4ea, 3.4);
  key.position.set(-260, 380, 340);
  const rim = new THREE.DirectionalLight(0xdfe7ff, 2.4);
  rim.position.set(320, 160, -380);
  const fill = new THREE.HemisphereLight(0xc4c9d4, 0x111113, 0.9);
  scene.add(key, rim, fill);

  // Zoommer mode: warm orange bounce/rim lights, faded in and out with the backdrop
  // (cheaper and smoother than swapping the environment map).
  const zHemi = new THREE.HemisphereLight(0xffd9bf, 0xff7a3a, 0);
  const zWarmL = new THREE.DirectionalLight(0xff6a1f, 0);
  zWarmL.position.set(-380, 60, -120);
  const zWarmR = new THREE.DirectionalLight(0xff8a45, 0);
  zWarmR.position.set(400, -40, 160);
  scene.add(zHemi, zWarmL, zWarmR);
  const RIM_BASE = rim.intensity;
  const themeLight = { mix: 0, target: 0 };
  // Warm Zoommer lights at mix m (0 … 1) — gentler than on the matte bowl: the glossy white glaze picks up colour fast.
  function setThemeLight(m) {
    zHemi.intensity = 0.3 * m; zWarmL.intensity = 1.0 * m; zWarmR.intensity = 0.6 * m;
    rim.intensity = RIM_BASE * (1 - 0.4 * m);
  }

  // ───────────────────────── Vase geometry ─────────────────────────
  await step('მოდელის აგება…');
  // One closed lathe shell as a grid of rings (M points round each): recessed base → foot ring → outer wall →
  // rounded lip → inner wall → floor. Normals come from the whole grid, so the separately textured foot, outside
  // and inside meshes meet without a shading seam.
  const isSmall = Math.min(window.innerWidth, window.innerHeight) < 700;
  const M = isSmall ? 160 : 240, NT_OUT = isSmall ? 150 : 210, NT_IN = isSmall ? 70 : 100, K = 8;
  const TH = Array.from({ length: M }, (_, j) => j / M * TAU);
  const rows = [];                                            // { r, y (above the foot bottom), n?: forced normal }
  // base: recess centre → recess edge → inner foot wall → flat foot ring (unglazed)
  rows.push({ r: 0, y: RECESS, n: new THREE.Vector3(0, -1, 0) });
  for (const [r, y] of [[12, RECESS], [24, RECESS], [36, RECESS], [42.6, RECESS], [44.1, RECESS - 0.3], [44.9, RECESS - 1.1],
    [45.3, 1.2], [45.8, 0.35], [46.8, 0], [51.6, 0]]) rows.push({ r, y });
  const iOut0 = rows.length;
  for (const p of outerCurve.getSpacedPoints(NT_OUT)) rows.push({ r: p.x, y: p.y });
  {                                                            // lip: quarter round, flat top, quarter round
    const { ro, ri, top, rr } = LIP;
    for (let k = 1; k <= K; k++) { const a = k / K * Math.PI / 2; rows.push({ r: ro - rr + rr * Math.cos(a), y: top - rr + rr * Math.sin(a) }); }
    for (let k = 1; k < 4; k++) rows.push({ r: lerp(ro - rr, ri + rr, k / 4), y: top });
    for (let k = 0; k <= K; k++) { const a = Math.PI / 2 + k / K * Math.PI / 2; rows.push({ r: ri + rr + rr * Math.cos(a), y: top - rr + rr * Math.sin(a) }); }

    if (themeLight.mix !== themeLight.target) {
      const d = themeLight.target - themeLight.mix;
      themeLight.mix = Math.abs(d) < 0.002 || reducedMotion ? themeLight.target : themeLight.mix + d * (1 - Math.exp(-dt * 4.2));
      setThemeLight(themeLight.mix);
    }
    if (currentTheme === 'zoommer' && !reducedMotion) {
      const f = 1 - Math.exp(-dt * 3);
      const nx = parallax.x + (parallax.tx - parallax.x) * f;
      const ny = parallax.y + (parallax.ty - parallax.y) * f;
      if (Math.abs(nx - parallax.x) + Math.abs(ny - parallax.y) > 0.0005) {
        parallax.x = nx; parallax.y = ny;
        zenvEl.style.setProperty('--px', nx.toFixed(4));
        zenvEl.style.setProperty('--py', ny.toFixed(4));
      }
    }

    const dist = baseDist * state.zoom;
    LOOK_AT.y = -lookFactor * dist;
    const elev = 0.07;
    camera.position.set(LOOK_AT.x, LOOK_AT.y + Math.sin(elev) * dist, Math.cos(elev) * dist);
    camera.lookAt(LOOK_AT);

    updateShadow();
    renderer.render(scene, camera);

    // Adaptive resolution: step the pixel ratio down if the GPU can't keep up.
    perfFrames++; perfTime += dt;
    if (perfFrames >= 90) {
      const avg = perfTime / perfFrames;
      if (avg > 1 / 40 && pixelRatio > 1) {
        pixelRatio = Math.max(1, pixelRatio - 0.25);
        renderer.setPixelRatio(pixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight, false);
      }
      perfFrames = 0; perfTime = 0;
    }
  }

  await step('შეიდერების კომპილაცია…');
  camera.position.set(0, 0, baseDist);
  camera.lookAt(LOOK_AT);
  try { await renderer.compileAsync(scene, camera); } catch (e) { /* falls back to compile on first render */ }

  renderer.setAnimationLoop(frame);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    window.__READY__ = true;
    clearTimeout(window.__loadTimer);
    loaderEl.classList.add('done');
    setTimeout(() => { loaderEl.style.display = 'none'; }, 800);
  }));
}
</script>
</body>
</html>
